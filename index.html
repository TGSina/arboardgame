<!doctype html>
<html lang="en">
<head>
  <script src="./js/xr-compat.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Board Game – prototype</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="overlay">
    <div id="touchpad"></div>
    <div id="top">
      <div id="status"></div>
      <pre id="hud"></pre>
    </div>
    <div id="controls">
      <button id="btn-zoom-out">−</button>
      <button id="btn-zoom-in">+</button>
      <button id="btn-debug">Debug: ON</button>
      <button id="btn-anchor">Anchor: ON</button>
      <button id="reset" hidden>Re-place</button>
    </div>
    <div id="promotion-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="promotion-title">
      <div class="promotion-panel">
        <p id="promotion-title">Pawn promotion</p>
        <div class="promotion-choices">
          <button type="button" data-promotion="q" aria-label="Promote to queen">Q</button>
          <button type="button" data-promotion="r" aria-label="Promote to rook">R</button>
          <button type="button" data-promotion="b" aria-label="Promote to bishop">B</button>
          <button type="button" data-promotion="n" aria-label="Promote to knight">N</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
